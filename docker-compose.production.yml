services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env.production
    depends_on:
      - mongo
      - redis
    expose:
      - "5000"

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certs:/etc/nginx/certs:ro

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
